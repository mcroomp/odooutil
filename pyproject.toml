[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "odooutil"
version = "0.1.2"
description = "Typed Odoo infrastructure and preview-first administration utilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.10"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
odoo-query = "odooutil.query:main"
odoo-schema = "odooutil.schema:main"
odoo-report = "odooutil.report:main"

[project.urls]
Repository = "https://github.com/mcroomp/odooutil"

[tool.uv]
required-version = ">=0.13.1"
default-groups = []
python-downloads = "never"

[tool.uv.build-backend]
module-name = ["odoobase", "odooutil"]
module-root = ""

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.407",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "C4", "PIE", "RUF", "PLC0415"]

[tool.pyright]
include = ["odoobase", "odooutil", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["odoobase", "odooutil"]
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "package-layers"
name = "Utilities depend on the base, never the reverse"
type = "layers"
layers = ["odooutil", "odoobase"]
